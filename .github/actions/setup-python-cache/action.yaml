name: 'Setup Python and Cache Dependencies'
description: 'Sets up Python environment, installs pipenv, caches virtual environments, and installs dependencies'
inputs:
  python-version:
    description: 'Python version to setup'
    required: false
    default: '3.10'
  working-directory:
    description: 'Working directory for backend'
    required: false
    default: 'starter/backend'

runs:
  using: 'composite'
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Pipenv
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install pipenv

    - name: Cache Pipenv virtualenvs
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/virtualenvs
          ~/.cache/pip
          ~/.cache/pipenv
        key: ${{ runner.os }}-pipenv-${{ inputs.python-version }}-${{ hashFiles(format('{0}/Pipfile.lock', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-pipenv-${{ inputs.python-version }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pipenv install --dev

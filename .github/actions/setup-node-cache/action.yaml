name: 'Setup Node.js and Cache Dependencies'
description: 'Sets up Node.js environment, caches npm dependencies, and runs npm ci'
inputs:
  node-version:
    description: 'Node.js version to setup'
    required: false
    default: '18.14'
  working-directory:
    description: 'Working directory for frontend'
    required: false
    default: 'starter/frontend'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          ${{ inputs.working-directory }}/node_modules
        key: ${{ runner.os }}-node-${{ inputs.node-version }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: |
          ${{ runner.os }}-node-${{ inputs.node-version }}-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

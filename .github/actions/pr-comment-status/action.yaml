name: 'PR Status Commenter'
description: 'Posts or updates a comment on pull requests with CI workflow run status'
inputs:
  github-token:
    description: 'GitHub token for API authentication'
    required: true
  workflow-name:
    description: 'Name of the workflow'
    required: true
  status:
    description: 'Status of the workflow run (success, failure, etc.)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Post PR Comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const status = '${{ inputs.status }}';
          const icon = status === 'success' ? '✅' : '❌';
          const body = `### ${icon} ${inputs['workflow-name']} Status: **${status.toUpperCase()}**\n\n- **Commit**: \`${context.sha.substring(0, 7)}\`\n- **Run**: [#${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n- **Actor**: @${context.actor}`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
